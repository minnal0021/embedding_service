[project]
name = "embedding-service"
version = "0.1.0"
requires-python = ">=3.14"
# The HTTP gateway (src/server.py) and model download (src/fetch_models.py) —
# all the Docker gateway image installs.
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "httpx",
    "huggingface-hub>=1.21.0",
]

[dependency-groups]
# The offline sample-embedding / centroid pipeline (embeddings come from the
# running service). Installed by default for local `uv sync` / `uv run`.
tools = [
    "pandas",
    "pyarrow",
    "tqdm",
    "scikit-learn",
]

[tool.uv]
default-groups = ["tools"]
