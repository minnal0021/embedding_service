# NVIDIA GPU (Linux or WSL2). Needs the NVIDIA Container Toolkit on the host.
x-cuda: &cuda
  image: ghcr.io/ggml-org/llama.cpp:server-cuda
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  llama-gemma: *cuda
  llama-qwen: *cuda
